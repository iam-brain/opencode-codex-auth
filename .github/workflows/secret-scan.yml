name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Reviewed PR head commit SHA
        required: true
        type: string

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify reviewed head
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REVIEWED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$REVIEWED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$REVIEWED_HEAD_SHA" = "$GITHUB_SHA"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
