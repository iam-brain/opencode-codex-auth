name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Reviewed PR head commit SHA
        required: true
        type: string

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]]; then
            echo "Same-repository pull requests require exact-head manual dispatch." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$REVIEWED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$REVIEWED_HEAD_SHA"
            test "$REVIEWED_HEAD_SHA" = "$GITHUB_SHA"
          fi

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
